[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autosguitar"
version = "0.1.0"
description = "Sforzando Standard Guitar 音源向けキースイッチ自動付加ツール"
requires-python = ">=3.10"
dependencies = [
    "mido>=1.3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
autosguitar = "autosguitar.cli:main"

[tool.setuptools.packages.find]
include = ["autosguitar*"]

[tool.setuptools.package-data]
autosguitar = ["rules.default.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
